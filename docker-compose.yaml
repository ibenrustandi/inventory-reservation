# Local development stack. Credentials here are defaults for local use only.
# Start everything with: docker compose up --build

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://inventory:inventory@postgres:5432/inventory?sslmode=disable
      # Shorten these to watch expiry without waiting, for example
      # RESERVATION_TTL=30s docker compose up
      RESERVATION_TTL: "${RESERVATION_TTL:-5m}"
      SWEEP_INTERVAL: "${SWEEP_INTERVAL:-1s}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The server handles SIGTERM itself; give it time to finish in-flight work.
    stop_grace_period: 20s

volumes:
  postgres-data:
