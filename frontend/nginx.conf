server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The browser talks only to this server, so the backend needs no CORS
  # setup. "backend" is the service name in docker-compose.yaml.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite puts a content hash in these file names, so they can be cached for
  # a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must always be fresh, so a new build is picked up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
